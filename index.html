<script>
// Baked-in fallback so the page still works if manifest.json can't be fetched
// (e.g. opened as a local file). manifest.json, when reachable, overrides this.
var FALLBACK = {
  apps: [
    { name: "CinemaHQ",            version: "8.5",    file: "CinemaHQ-v8.5.apk",            size: 55088558, official: "",                                                                     latest: { version: "8.5",    url: "CinemaHQ-v8.5.apk" } },
    { name: "Netfly (TV)",         version: "3.0.4",  file: "Netfly-v3.0.4-TV.apk",         size: 65649883, official: "",                                                                     latest: { version: "3.0.4",  url: "Netfly-v3.0.4-TV.apk" } },
    { name: "Reezn",               version: "2.0.20", file: "Reezn-v2.0.20.apk",            size: 35427128, official: "",                                                                     latest: { version: "2.0.20", url: "Reezn-v2.0.20.apk" } },
    { name: "SmartTube",           version: "32.56",  file: "SmartTube-v32.56.apk",         size: 25046686, official: "https://github.com/yuliskov/SmartTube/releases/latest",                latest: { version: "32.56",  url: "SmartTube-v32.56.apk" } },
    { name: "Projectivy Launcher", version: "4.72",   file: "ProjectivyLauncher-v4.72.apk", size: 11432750, official: "https://play.google.com/store/apps/details?id=com.spocky.projengmenu", latest: { version: "4.72",   url: "ProjectivyLauncher-v4.72.apk" } },
    { name: "Projectivy Icon Pack",version: "1.1.9",  file: "ProjectivyIconPack-v1.1.9.apk",size: 17139097, official: "https://play.google.com/store/apps/developer?id=Spocky",                latest: { version: "1.1.9",  url: "ProjectivyIconPack-v1.1.9.apk" } }
  ]
};

function fmtSize(b) {
  if (!b && b !== 0) return "";
  return (b / 1e6).toFixed(1) + " MB";
}

// Compare dotted version strings numerically; returns 1 if a>b, -1 if a<b, 0 if equal.
function cmpVer(a, b) {
  var pa = String(a).split("."), pb = String(b).split(".");
  var n = Math.max(pa.length, pb.length);
  for (var i = 0; i < n; i++) {
    var x = parseInt(pa[i] || "0", 10), y = parseInt(pb[i] || "0", 10);
    if (isNaN(x)) x = 0; if (isNaN(y)) y = 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function render(data) {
  var list = document.getElementById("list");
  list.innerHTML = "";
  var updates = 0;

  data.apps.forEach(function (app) {
    var latestVer = (app.latest && app.latest.version) ? app.latest.version : app.version;
    var hasUpdate = !!(app.latest && app.latest.version && app.latest.url &&
                       cmpVer(app.latest.version, app.version) > 0);
    if (hasUpdate) updates++;

    var official = app.official || "";
    var offlink = official
      ? ' <a class="offlink" href="' + esc(official) + '" target="_blank" rel="noopener">&middot; Official &#8599;</a>'
      : '';

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="top">' +
        '<div class="meta">' +
          '<div class="name">' + esc(app.name) + '</div>' +
          (app.size ? '<div class="size">' + fmtSize(app.size) + '</div>' : '') +
          '<div class="vers">' +
            '<span class="pill cur"><span class="lbl">GITHUB</span> v' + esc(app.version) + '</span>' +
            '<span class="pill lat' + (hasUpdate ? ' new' : '') + '"><span class="lbl">LATEST</span> v' + esc(latestVer) + '</span>' +
            offlink +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<a class="btn dl" href="' + esc(app.file) + '">Download</a>' +
        (hasUpdate ? '<a class="btn update-btn" href="' + esc(app.latest.url) + '">&#9650; Update</a>' : '') +
        (hasUpdate && official ? '<a class="btn official-btn" href="' + esc(official) + '" target="_blank" rel="noopener">Update (via Official)</a>' : '') +
      '</div>';

    list.appendChild(card);
  });

  var status = document.getElementById("status");
  if (updates > 0) {
    status.innerHTML = '<b>' + updates + '</b> update' + (updates === 1 ? "" : "s") + ' available';
  } else {
    status.innerHTML = 'All apps up to date';
  }
}

// Try the live manifest first; fall back to the baked-in list on any failure.
(function () {
  var done = false;
  function go(data) { if (!done) { done = true; render(data); } }

  try {
    fetch("manifest.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        if (d && d.apps && d.apps.length) go(d); else go(FALLBACK);
      })
      .catch(function () { go(FALLBACK); });
  } catch (e) {
    go(FALLBACK);
  }

  // Safety net if fetch hangs or isn't available.
  setTimeout(function () { go(FALLBACK); }, 4000);
})();
</script>
