<!doctype html>

<head>

<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #4f9dff;
    --accent-ink: #ffffff;
    --update-bg: #15351f;
    --update-border: #2f6b3f;
    --update-ink: #7ee29a;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #1a1d24; --card-border: #2a2f3a; --text: #e8eaed;
    --muted: #9aa3b2; --accent: #4f9dff; --accent-ink: #ffffff;
    --update-bg: #15351f; --update-border: #2f6b3f; --update-ink: #7ee29a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8; --card: #ffffff; --card-border: #e2e5ea; --text: #1a1d24;
      --muted: #5a6474; --accent: #1565d8; --accent-ink: #ffffff;
      --update-bg: #e7f6ec; --update-border: #9bd6ac; --update-ink: #1b7a38;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8; --card: #ffffff; --card-border: #e2e5ea; --text: #1a1d24;
    --muted: #5a6474; --accent: #1565d8; --accent-ink: #ffffff;
    --update-bg: #e7f6ec; --update-border: #9bd6ac; --update-ink: #1b7a38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; padding: 0 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 0 64px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0; }
  .list { display: grid; gap: 8px; }
  .card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 12px 16px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .meta { min-width: 0; }
  .name { font-weight: 600; font-size: 1.05rem; word-break: break-word; }
  .vers { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.82rem; }
  .vers .k { color: var(--muted); }
  .vers .cur b { color: var(--text); font-weight: 600; }
  .vers .lat b { color: var(--muted); font-weight: 600; }
  .vers .lat.new b { color: var(--update-ink); font-weight: 700; }
  .size { color: var(--muted); font-size: 0.78rem; margin-top: 3px; }
  .actions { flex: none; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .btn {
    text-decoration: none; text-align: center; font-weight: 600; font-size: 0.88rem;
    padding: 8px 15px; border-radius: 8px; white-space: nowrap;
  }
  .dl { background: var(--accent); color: var(--accent-ink); }
  .dl:hover { filter: brightness(1.08); }
  .update-btn {
    background: var(--update-bg); color: var(--update-ink); border: 1px solid var(--update-border);
  }
  .update-btn:hover { filter: brightness(1.08); }
  .codebox {
    display: flex; align-items: center; gap: 16px; text-decoration: none;
    background: var(--card); border: 1px solid var(--accent);
    border-radius: 12px; padding: 16px 20px; margin: 0 0 24px;
  }
  .codebox:hover { filter: brightness(1.05); }
  .codebox .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.9rem; font-weight: 700; letter-spacing: 0.04em; color: var(--accent);
    line-height: 1;
  }
  .codebox .ct { min-width: 0; }
  .codebox .label { display: block; font-weight: 700; color: var(--text); font-size: 0.95rem; }
  .codebox .hint { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .status { color: var(--muted); font-size: 0.8rem; margin: 0 0 20px; min-height: 1em; }
  footer { margin-top: 36px; color: var(--muted); font-size: 0.8rem; text-align: center; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>GM apks - 7934617</h1>
    </header>

    <p class="status" id="status">Loading&hellip;</p>
    <div class="list" id="list"></div>

    <footer>
      Hosted on <a href="https://github.com/one50bpm-cpu/gm-apks">GitHub</a>.
    </footer>
  </div>

<script>
// Baked-in fallback so the page still works if manifest.json can't be fetched
// (e.g. opened as a local file). manifest.json, when reachable, overrides this.
var FALLBACK = {
  apps: [
    { name: "CinemaHQ",            version: "8.5",    file: "CinemaHQ-v8.5.apk",            size: 55088558, latest: { version: "8.5",    url: "CinemaHQ-v8.5.apk" } },
    { name: "Netfly (TV)",         version: "3.0.4",  file: "Netfly-v3.0.4-TV.apk",         size: 65649883, latest: { version: "3.0.4",  url: "Netfly-v3.0.4-TV.apk" } },
    { name: "Reezn",               version: "2.0.20", file: "Reezn-v2.0.20.apk",            size: 35427128, latest: { version: "2.0.20", url: "Reezn-v2.0.20.apk" } },
    { name: "Downloader",          version: "2.0.4",  file: "Downloader-v2.0.4.apk",        size: 10856724, latest: { version: "2.0.4",  url: "Downloader-v2.0.4.apk" } },
    { name: "Projectivy Launcher", version: "4.72",   file: "ProjectivyLauncher-v4.72.apk", size: 11432750, latest: { version: "4.72",   url: "ProjectivyLauncher-v4.72.apk" } },
    { name: "Projectivy Icon Pack",version: "1.1.9",  file: "ProjectivyIconPack-v1.1.9.apk",size: 17139097, latest: { version: "1.1.9",  url: "ProjectivyIconPack-v1.1.9.apk" } }
  ]
};

function fmtSize(b) {
  if (!b && b !== 0) return "";
  return (b / 1e6).toFixed(1) + " MB";
}

// Compare dotted version strings numerically; returns 1 if a>b, -1 if a<b, 0 if equal.
function cmpVer(a, b) {
  var pa = String(a).split("."), pb = String(b).split(".");
  var n = Math.max(pa.length, pb.length);
  for (var i = 0; i < n; i++) {
    var x = parseInt(pa[i] || "0", 10), y = parseInt(pb[i] || "0", 10);
    if (isNaN(x)) x = 0; if (isNaN(y)) y = 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function render(data) {
  var list = document.getElementById("list");
  list.innerHTML = "";
  var updates = 0;

  data.apps.forEach(function (app) {
    var card = document.createElement("div");
    card.className = "card";

    var latestVer = (app.latest && app.latest.version) ? app.latest.version : app.version;
    var hasUpdate = !!(app.latest && app.latest.version && app.latest.url &&
                       cmpVer(app.latest.version, app.version) > 0);
    if (hasUpdate) updates++;

    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<div class="meta">' +
        '<div class="name">' + esc(app.name) + '</div>' +
        '<div class="vers">' +
          '<span class="cur"><span class="k">Current (GitHub):</span> <b>v' + esc(app.version) + '</b></span>' +
          '<span class="lat' + (hasUpdate ? ' new' : '') + '">' +
            '<span class="k">Latest found:</span> <b>v' + esc(latestVer) + '</b>' +
          '</span>' +
        '</div>' +
        (app.size ? '<div class="size">' + fmtSize(app.size) + '</div>' : '') +
      '</div>' +
      '<div class="actions">' +
        '<a class="btn dl" href="' + esc(app.file) + '">Download</a>' +
        (hasUpdate ? '<a class="btn update-btn" href="' + esc(app.latest.url) + '">&#9650; Update</a>' : '') +
      '</div>';
    card.appendChild(row);

    list.appendChild(card);
  });

  var status = document.getElementById("status");
  if (updates > 0) {
    status.textContent = updates + " update" + (updates === 1 ? "" : "s") + " available.";
  } else {
    status.textContent = "All apps are up to date.";
  }
}

// Try the live manifest first; fall back to the baked-in list on any failure.
(function () {
  var done = false;
  function go(data) { if (!done) { done = true; render(data); } }

  try {
    fetch("manifest.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        if (d && d.apps && d.apps.length) go(d); else go(FALLBACK);
      })
      .catch(function () { go(FALLBACK); });
  } catch (e) {
    go(FALLBACK);
  }

  // Safety net if fetch hangs or isn't available.
  setTimeout(function () { go(FALLBACK); }, 4000);
})();
</script>
</body>
